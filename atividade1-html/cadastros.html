<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - EcoAção</title>
  <link rel="shortcut icon" href="imagens/icon.ico" type="icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="imagens/logo.png" id="log" alt="logo">
    <h1>EcoAção </h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastros.html" class="active">Cadastros</a></li>
      </ul>
    </nav>
  </header>

  <section class="contato">
    <h2>Entre em Contato</h2>
    <form>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required>

      <label for="CPF">CPF:</label>
      <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>

      <label for="data de nascimento">Data de Nascimento:</label>
      <input type="text" id="data" name="data" placeholder="Digite sua data de Nascimento" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="Digite seu E-mail" required>

      <label for="Telefone">Telefone:</label>
      <input type="text" id="telefone" name="telefone" placeholder="Digite seu Telefone" required>

      <label for="endereco">Endereço:</label>
      <input type="text" id="endereco" name="endereco" placeholder="Digite seu Endereço" required>

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </section>

  <footer>
    <p>© 2025 EcoAção - Contato: ecoacao@email.com</p>
  </footer>
</body>
</html>
